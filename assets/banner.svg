<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="peerdraw — real-time collaborative drawing, peer to peer">

  <rect width="1280" height="360" fill="#f3efe6"/>

  <text x="610" y="215" text-anchor="end" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-weight="900" font-size="200" letter-spacing="-8" fill="#0a0a0a">peer</text>

  <!-- 3-cell vertical separator dot: dark · green · dark -->
  <g transform="translate(636 100)">
    <rect x="0" y="0"  width="36" height="36" fill="#0a0a0a"/>
    <rect x="0" y="44" width="36" height="36" fill="#1aa05a"/>
    <rect x="0" y="88" width="36" height="36" fill="#0a0a0a"/>
  </g>

  <text x="700" y="215" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-weight="900" font-size="200" letter-spacing="-8" fill="#0a0a0a">draw</text>

  <text x="640" y="320" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="18" font-weight="500" letter-spacing="6" fill="#4a4a4a">REAL-TIME  COLLABORATIVE  DRAWING  ·  PEER  TO  PEER</text>
</svg>
